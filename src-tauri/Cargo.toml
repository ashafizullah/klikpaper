[package]
name = "klikpaper"
version = "0.1.4"
description = "Free, open-source, lightweight PDF tool"
authors = ["Adam Suchi Hafizullah"]
edition = "2024"
license = "MIT"
repository = "https://github.com/ashafizullah/klikpaper"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a Windows issue).
name = "klikpaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs"] }
futures = "0.3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
lopdf = { version = "0.46", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
portable-pty = "0.9.0"
base64 = "0.23.1"
fontdb = "0.23"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
