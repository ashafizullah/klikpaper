name: Bug report
description: Something in KlikPaper doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search the [existing issues](https://github.com/ashafizullah/klikpaper/issues) first. For security problems, use [Report a vulnerability](https://github.com/ashafizullah/klikpaper/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
      placeholder: Merging two scanned PDFs leaves the second file's pages blank.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: KlikPaper version
      description: The release you installed, e.g. from the DMG or installer file name.
      placeholder: 0.1.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: macOS 15.5 (Apple Silicon) / Windows 11 24H2 / Ubuntu 24.04
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Viewer / search
        - Organize pages (merge, split, rotate, reorder)
        - Compress / convert
        - Annotate / sign / forms
        - Security (password, metadata)
        - AI chat
        - Claude Code (MCP)
        - Other
    validations:
      required: true
  - type: input
    id: pdf
    attributes:
      label: About the PDF
      description: Page count, size, where it came from (scanner, Word, browser...). Never attach private documents.
      placeholder: 40 pages, 12 MB, scanned on an office copier
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Error messages or logs. Remove credentials and private data first.
